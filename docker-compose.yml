services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        format: raw
    environment:
      DATABASE_URL: postgresql://samick:${SAMICK_DB_PASSWORD:?Isi SAMICK_DB_PASSWORD di .env}@db:5432/samick_demo
      UPLOAD_DIR: /app/data/uploads
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-3000}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: samick_demo
      POSTGRES_USER: samick
      POSTGRES_PASSWORD: ${SAMICK_DB_PASSWORD:?Isi SAMICK_DB_PASSWORD di .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - samick_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samick -d samick_demo"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  samick_postgres:
